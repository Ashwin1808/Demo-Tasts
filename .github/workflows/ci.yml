name: Task Manager CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BACKEND TESTS
  # ============================================================

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: mvn clean verify


  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ============================================================
  # SECRET SCAN
  # ============================================================

  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # FILESYSTEM SECURITY SCAN
  # ============================================================

  security-scan:
    name: Security Scan - Trivy Filesystem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  # ============================================================
  # DOCKER BUILD + SECURITY SCAN + SBOM + PUBLISH
  # ============================================================

  docker-build-scan-publish:
    name: Build, Scan and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build
      - secret-scan
      - security-scan

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # DOCKER SETUP
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # GHCR LOGIN
      # --------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # BUILD IMAGES
      # --------------------------------------------------------

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: task-manager-backend:${{ github.sha }}


      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: task-manager-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # TRIVY DOCKER IMAGE SCAN
      # --------------------------------------------------------

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-manager-backend:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0


      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-manager-frontend:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0


      # --------------------------------------------------------
      # GENERATE SBOM
      # --------------------------------------------------------

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-manager-backend:${{ github.sha }}
          format: cyclonedx
          output: backend-sbom.json
          exit-code: 0


      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-manager-frontend:${{ github.sha }}
          format: cyclonedx
          output: frontend-sbom.json
          exit-code: 0


      # --------------------------------------------------------
      # UPLOAD SBOM ARTIFACTS
      # --------------------------------------------------------

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-sboms
          path: |
            backend-sbom.json
            frontend-sbom.json


      # --------------------------------------------------------
      # TAG IMAGES FOR GHCR
      # --------------------------------------------------------

      - name: Tag backend image for GHCR
        run: |
          docker tag \
            task-manager-backend:${{ github.sha }} \
            ghcr.io/ashwin1808/task-manager-backend:${{ github.sha }}


      - name: Tag frontend image for GHCR
        run: |
          docker tag \
            task-manager-frontend:${{ github.sha }} \
            ghcr.io/ashwin1808/task-manager-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH IMAGES TO GHCR
      # --------------------------------------------------------

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/ashwin1808/task-manager-backend:${{ github.sha }}


      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/ashwin1808/task-manager-frontend:${{ github.sha }}